// overlay.proto — wire schema for the public-overlay socket broadcasts
// (liveMatchUpdate / overallDataUpdate on the round:${tid}:${rid}:* rooms).
//
// This file is the source of truth for Render_hosted/test-back. There is no
// monorepo/shared-package tooling across the three repos in this project
// (backend, front, desktop-app each have their own .git), so front/src/proto
// keeps a hand-mirrored copy — same manual-sync convention already used for
// the VIEWS_NEEDING_* tables (see Bulkpublic.controller.js). If you change a
// field here, update front/src/proto/overlay.proto to match, then regenerate
// both sides (`npm run proto:gen` in each repo).
//
// No field uses `optional` — checked every live/numeric field against actual
// frontend usage (health/liveState are always compared or divided, never
// presence-checked) and every server write path already defaults these
// before they'd reach an encoder. Proto3's default-0/""/false semantics
// already match this codebase's existing "0/empty means no data" convention.
syntax = "proto3";
package overlay;

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Shared by both the live-match tier (liveMatchUpdate) and the
// overall-standings tier (overallDataUpdate) — aggregateOverallTeams
// (overall.controller.js) carries the same NUMERIC_PLAYER_FIELDS list as the
// live path, so a separate summary message isn't justified by field count.
message Player {
  string uId = 1;
  string playerName = 2;
  string playerOpenId = 3;
  string picUrl = 4;
  string showPicUrl = 5;
  string character = 6;
  // Confirmed via matchData.model.js (schema says String) vs. the actual hot
  // live-tick assignment in pubgApiMatchData.controller.js (`teamIdfromApi:
  // team.slot`, a Number, at both finalPlayer construction sites) — this
  // path genuinely sends a number, so the wire type follows the real data,
  // not the (inconsistent) Mongoose schema declaration.
  int32 teamIdfromApi = 7;
  int32 teamId = 8;
  string teamName = 9;

  Vec3 location = 10;
  int32 health = 11;
  int32 healthMax = 12;
  int32 liveState = 13;
  bool isFiring = 14;
  bool bHasDied = 15;
  bool isOutsideBlueCircle = 16;

  int32 killNum = 20;
  int32 killNumBeforeDie = 21;
  int32 gotAirDropNum = 22;
  int32 maxKillDistance = 23;
  int32 damage = 24;
  int32 killNumInVehicle = 25;
  int32 killNumByGrenade = 26;
  int32 AIKillNum = 27;
  int32 BossKillNum = 28;
  int32 rank = 29;
  int32 inDamage = 30;
  int32 headShotNum = 31;
  int32 survivalTime = 32;
  int32 driveDistance = 33;
  int32 marchDistance = 34;
  int32 assists = 35;
  int32 outsideBlueCircleTime = 36;
  int32 knockouts = 37;
  int32 rescueTimes = 38;
  int32 useSmokeGrenadeNum = 39;
  int32 useFragGrenadeNum = 40;
  int32 useBurnGrenadeNum = 41;
  int32 useFlashGrenadeNum = 42;
  int32 PoisonTotalDamage = 43;
  int32 UseSelfRescueTime = 44;
  int32 UseEmergencyCallTime = 45;
  int32 contribution = 46;
  int32 heal = 47;
  // matchData.model.js's playerStatsSchema declares `{ _id: true }` — every
  // player subdoc gets its OWN Mongo ObjectId, separate from `uId` (PUBG's
  // player identifier). front's shared Player type (unsortteams.ts) treats
  // `_id` as required (used for React keys / ref lookups / merge-by-id), so
  // it must survive the wire regardless of encoding. Proto identifiers
  // can't start with `_` (grammar: letter first), so this is named `docId`
  // here and remapped back to `_id` client-side immediately after decode —
  // see PublicThemeRenderer.tsx's remapProtoPlayer.
  string docId = 48;
}

message Team {
  // teamMatchDataSchema.teamId is itself a Mongo ObjectId reference to the
  // Team collection (`ref: 'Team'`) — NOT a PUBG numeric id (that's
  // Player.teamIdfromApi/teamId above). Separately, the team SUBDOC itself
  // also gets its own Mongo _id (`{ _id: true }` on the schema) — two
  // distinct ObjectIds. front's shared Team type (unsortteams.ts) requires
  // `_id` and optionally reads `teamId`, and PublicThemeRenderer's merge
  // keys off `String(t.teamId ?? t._id)` — both must survive the wire
  // as separate values, not be collapsed into one. `docId` -> `_id` remap
  // client-side, same reasoning as Player.docId above.
  string teamId = 1;
  string docId = 2;
  string teamName = 3;
  string teamTag = 4;
  string teamLogo = 5;
  int32 slot = 6;
  int32 placePoints = 7;
  int32 rank = 8;            // live-tier only
  int32 wwcd = 9;            // overall-tier only
  int32 matchesPlayed = 10;  // overall-tier only
  repeated Player players = 11;
}

// liveMatchUpdate payload. Deliberately has NO deadTeamList field — verified
// the frontend never reads matchData.deadTeamList off the wire (it computes
// its own client-side; see PublicThemeRenderer.tsx's DeadTeamListEntry
// comment: "No longer sourced from the backend's matchData.deadTeamList
// field").
message MatchDataPayload {
  string matchId = 1;
  repeated Team teams = 2;
  reserved 3; // isPartialTeams — only set by Bulkpublic.controller.js's HTTP-bulk diffing path, never the direct socket-emit path this schema covers. Reserved as a future on-ramp, not populated today.
}

// overallDataUpdate payload. Matches the plain object actually built at the
// three real emit call sites (pubgApiMatchData.controller.js,
// matchData.controller.js, overall.controller.js) — NOT
// Bulkpublic.controller.js's HTTP-only getOverallForRound shape (which adds
// totalMatches and is unrelated to this socket path).
message OverallDataPayload {
  string tournamentId = 1;
  string roundId = 2;
  string matchId = 3;
  repeated Team teams = 4;
  string createdAt = 5; // ISO string
}
